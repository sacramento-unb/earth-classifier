openapi: 3.1.0
info:
  title: Earth classifier API
  version: 0.1.0
  description: API versionada para áreas, disponibilidade, execuções, amostras e modelos.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      responses:
        '200': { description: OK }
  /api/v1/projects:
    get:
      responses:
        '200': { description: Projetos }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201': { description: Criado }
  /api/v1/areas:
    get:
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
      responses: { '200': { description: Áreas } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaInput' }
      responses: { '201': { description: Criado } }
  /api/v1/availability:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityInput' }
      responses: { '200': { description: Cenas STAC reais } }
  /api/v1/runs:
    get: { responses: { '200': { description: Histórico } } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunInput' }
      responses: { '202': { description: Job assíncrono criado } }
  /api/v1/runs/{runId}:
    get:
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses: { '200': { description: Detalhe da execução } }
  /api/v1/runs/{runId}/events:
    get:
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses: { '200': { description: Eventos para polling } }
  /api/v1/runs/{runId}/cancel:
    post:
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses: { '202': { description: Cancelamento cooperativo } }
  /api/v1/models:
    get: { responses: { '200': { description: Modelos e aprovação } } }
  /api/v1/taxonomies:
    get: { responses: { '200': { description: Taxonomias versionadas } } }
  /api/v1/sample-sets:
    get: { responses: { '200': { description: Conjuntos de amostras } } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, name]
              properties: { projectId: { type: string, format: uuid }, name: { type: string } }
      responses: { '201': { description: Criado } }
  /api/v1/sample-sets/{sampleSetId}/samples:
    post:
      parameters: [{ name: sampleSetId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { description: Amostra revisável registrada } }
  /api/v1/sample-sets/{sampleSetId}/train:
    post:
      parameters: [{ name: sampleSetId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '202': { description: Treino criado }, '409': { description: Pré-requisitos ausentes } }
components:
  parameters:
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    ProjectInput:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1 }, description: { type: string } }
    AreaInput:
      type: object
      required: [projectId, name, geometry]
      properties:
        projectId: { type: string, format: uuid }
        name: { type: string }
        geometry: { type: object, description: Polygon ou MultiPolygon GeoJSON em EPSG:4326 }
    AvailabilityInput:
      type: object
      required: [geometry, start, end]
      properties:
        geometry: { type: object }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    RunInput:
      type: object
      required: [projectId, areaId, start, end]
      properties:
        projectId: { type: string, format: uuid }
        areaId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        sensors: { type: array, items: { type: string, enum: [sentinel2, sentinel1] } }
