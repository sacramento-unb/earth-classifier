services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: earth_classifier
      POSTGRES_USER: earth
      POSTGRES_PASSWORD: earth
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earth -d earth_classifier"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://earth:earth@db:5432/earth_classifier?sslmode=disable
      API_PORT: 8080
      WEB_ORIGIN: http://localhost:3000
      STAC_API_URL: https://planetarycomputer.microsoft.com/api/stac/v1
      APP_ENV: development
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      DATABASE_URL: postgres://earth:earth@db:5432/earth_classifier?sslmode=disable
      STAC_API_URL: https://planetarycomputer.microsoft.com/api/stac/v1
      SCIENTIFIC_ENABLED: "false"
      ARTIFACT_ROOT: /artifacts
    volumes:
      - artifacts:/artifacts
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on: [api]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: earth
      MINIO_ROOT_PASSWORD: earthsecret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["object-data:/data"]

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    profiles: ["tiles"]
    ports: ["8000:8000"]

  science:
    build:
      context: .
      dockerfile: workers/geo_ml/Dockerfile
    profiles: ["science"]
    working_dir: /work
    environment:
      HF_HOME: /cache/huggingface
    volumes:
      - .:/work
      - huggingface-cache:/cache
      - ./artifacts:/work/artifacts

volumes:
  postgres-data:
  object-data:
  artifacts:
  huggingface-cache:
